<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Đăng Ký – Multi-step</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"/>
  <style>
   
    .step { display: none; }
    .step.active { display: block; }
  </style>
</head>
<body class="bg-light min-vh-100 d-flex align-items-center justify-content-center py-4">

<div class="card shadow" style="max-width:520px;width:100%">
  <div class="card-header bg-primary text-white text-center py-4">
    <h2 class="h4 fw-bold mb-1">Đăng Ký Tài Khoản</h2>
    <p class="mb-0 small opacity-75">Hoàn thành các bước để tạo tài khoản</p>
  </div>

  <div class="card-body p-4">

    <!-- PROGRESS BAR -->
    <div class="mb-1">
      <div class="d-flex justify-content-between small text-muted mb-2">
        <span id="stepLabel">Bước 1 / 3</span>
        <span id="stepName">Thông tin cá nhân</span>
      </div>
      <div class="progress mb-4" style="height:8px">
        <div id="progressBar" class="progress-bar bg-primary" style="width:33%;transition:width .4s"></div>
      </div>
    </div>

    <!-- STEP INDICATOR -->
    <div class="d-flex align-items-center mb-4">
      <div id="circle1" class="rounded-circle d-flex align-items-center justify-content-center fw-bold bg-primary text-white border border-primary" style="width:36px;height:36px;font-size:.9rem">1</div>
      <div id="line1" class="flex-grow-1 border-top border-secondary-subtle" style="height:2px"></div>
      <div id="circle2" class="rounded-circle d-flex align-items-center justify-content-center fw-bold bg-white text-secondary border" style="width:36px;height:36px;font-size:.9rem">2</div>
      <div id="line2" class="flex-grow-1 border-top border-secondary-subtle" style="height:2px"></div>
      <div id="circle3" class="rounded-circle d-flex align-items-center justify-content-center fw-bold bg-white text-secondary border" style="width:36px;height:36px;font-size:.9rem">3</div>
    </div>

    <!-- STEP 1: Thông tin cá nhân -->
    <div class="step active" id="step1">
      <h5 class="fw-bold mb-3"> Thông tin cá nhân</h5>

      <div class="mb-3">
        <label class="form-label fw-semibold">Họ và tên</label>
        <input type="text" id="fullname" class="form-control"/>
        <span class="text-danger small" id="fullname-error"></span>
      </div>

      <div class="mb-3">
        <label class="form-label fw-semibold">Ngày sinh</label>
        <input type="date" id="dob" class="form-control"/>
        <span class="text-danger small" id="dob-error"></span>
      </div>

      <div class="mb-4">
        <label class="form-label fw-semibold d-block">Giới tính</label>
        <div class="d-flex gap-4">
          <div class="form-check">
            <input class="form-check-input" type="radio" name="gender" id="genderMale" value="Nam" checked/>
            <label class="form-check-label" for="genderMale">Nam</label>
          </div>
          <div class="form-check">
            <input class="form-check-input" type="radio" name="gender" id="genderFemale" value="Nữ"/>
            <label class="form-check-label" for="genderFemale">Nữ</label>
          </div>
          <div class="form-check">
            <input class="form-check-input" type="radio" name="gender" id="genderOther" value="Khác"/>
            <label class="form-check-label" for="genderOther">Khác</label>
          </div>
        </div>
        <span class="text-danger small" id="gender-error"></span>
      </div>

      <div class="d-flex justify-content-end">
        <button type="button" class="btn btn-primary px-4" onclick="goNext(1)">Tiếp theo →</button>
      </div>
    </div>

    <!-- STEP 2: Thông tin tài khoản -->
    <div class="step" id="step2">
      <h5 class="fw-bold mb-3"> Thông tin tài khoản</h5>

      <div class="mb-3">
        <label class="form-label fw-semibold">Email</label>
        <input type="text" id="email" class="form-control"/>
        <span class="text-danger small" id="email-error"></span>
      </div>

      <div class="mb-2">
        <label class="form-label fw-semibold">Mật khẩu</label>
        <div class="input-group">
          <input type="password" id="password" class="form-control"/>
          <button type="button" class="btn btn-outline-secondary" id="togglePw"><i class="bi bi-eye" id="iconPw"></i></button>
        </div>
        <div class="mt-2">
          <div class="progress" style="height:6px">
            <div id="strengthBar" class="progress-bar" style="width:0%;transition:width .3s,background .3s"></div>
          </div>
          <span class="small" id="strengthLabel"></span>
        </div>
        <span class="text-danger small" id="password-error"></span>
      </div>

      <div class="mb-4">
        <label class="form-label fw-semibold">Xác nhận mật khẩu</label>
        <div class="input-group">
          <input type="password" id="repassword" class="form-control"/>
          <button type="button" class="btn btn-outline-secondary" id="toggleRepw"><i class="bi bi-eye" id="iconRepw"></i></button>
        </div>
        <span class="text-danger small" id="repassword-error"></span>
      </div>

      <div class="d-flex justify-content-between">
        <button type="button" class="btn btn-outline-secondary px-4" onclick="goBack(2)">← Quay lại</button>
        <button type="button" class="btn btn-primary px-4" onclick="goNext(2)">Tiếp theo →</button>
      </div>
    </div>

    <!-- STEP 3: Xác nhận -->
    <div class="step" id="step3">
      <h5 class="fw-bold mb-3"> Xác nhận thông tin</h5>
      <table class="table table-bordered table-sm mb-4">
        <tbody>
          <tr><th class="bg-light" style="width:40%">Họ và tên</th><td id="cf-fullname"></td></tr>
          <tr><th class="bg-light">Ngày sinh</th><td id="cf-dob"></td></tr>
          <tr><th class="bg-light">Giới tính</th><td id="cf-gender"></td></tr>
          <tr><th class="bg-light">Email</th><td id="cf-email"></td></tr>
        </tbody>
      </table>

      <div class="d-flex justify-content-between">
        <button type="button" class="btn btn-outline-secondary px-4" onclick="goBack(3)">← Quay lại</button>
        <button type="button" class="btn btn-success px-4" onclick="submitForm()">Hoàn tất</button>
      </div>
    </div>


  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="bttv2.js"></script>
</body>
</html>
