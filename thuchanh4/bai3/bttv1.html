<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Đăng Ký – Nâng Cấp</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"/>
</head>
<body class="bg-light min-vh-100 d-flex align-items-center justify-content-center py-4">

<div class="card shadow" style="max-width:520px;width:100%">
  <div class="card-header bg-primary text-white text-center py-4">
    <h2 class="h4 fw-bold mb-1">Đăng Ký Tài Khoản</h2>
    <p class="mb-0 small opacity-75">Điền đầy đủ thông tin bên dưới để tạo tài khoản</p>
  </div>

  <div class="card-body p-4">

    <!-- SUCCESS BOX -->
    <div id="successBox" class="text-center py-4" style="display:none">
      <div class="display-4 mb-3">🎉</div>
      <h3 class="h4 fw-bold text-success">Đăng ký thành công!</h3>
      <p class="text-secondary">Chào mừng <strong id="successName"></strong> đã gia nhập hệ thống.</p>
      <button class="btn btn-primary mt-2" onclick="resetForm()">Đăng ký tài khoản khác</button>
    </div>

    <!-- FORM -->
    <form id="registerForm" novalidate>

      <!-- Họ và tên + đếm ký tự -->
      <div class="mb-3">
        <label class="form-label fw-semibold">Họ và tên</label>
        <input type="text" id="fullname" class="form-control" maxlength="50"/>
        <div class="d-flex justify-content-between mt-1">
          <span class="text-danger small" id="fullname-error"></span>
          <span class="small text-muted" id="fullnameCount">0/50</span>
        </div>
      </div>

      <!-- Email -->
      <div class="mb-3">
        <label class="form-label fw-semibold">Email</label>
        <input type="text" id="email" class="form-control"/>
        <span class="text-danger small" id="email-error"></span>
      </div>

      <!-- Số điện thoại -->
      <div class="mb-3">
        <label class="form-label fw-semibold">Số điện thoại</label>
        <input type="text" id="phone" class="form-control"/>
        <span class="text-danger small" id="phone-error"></span>
      </div>

      <hr/>

      <!-- Mật khẩu + toggle + strength bar -->
      <div class="mb-2">
        <label class="form-label fw-semibold">Mật khẩu</label>
        <div class="input-group">
          <input type="password" id="password" class="form-control"/>
          <button type="button" class="btn btn-outline-secondary" id="togglePassword"><i class="bi bi-eye" id="iconPassword"></i></button>
        </div>
        <!-- Strength bar -->
        <div class="mt-2">
          <div class="progress" style="height:6px">
            <div id="strengthBar" class="progress-bar" role="progressbar" style="width:0%;transition:width .3s,background .3s"></div>
          </div>
          <span class="small" id="strengthLabel"></span>
        </div>
        <span class="text-danger small" id="password-error"></span>
      </div>

      <!-- Xác nhận mật khẩu + toggle -->
      <div class="mb-3">
        <label class="form-label fw-semibold">Xác nhận mật khẩu</label>
        <div class="input-group">
          <input type="password" id="repassword" class="form-control"/>
          <button type="button" class="btn btn-outline-secondary" id="toggleRepassword"><i class="bi bi-eye" id="iconRepassword"></i></button>
        </div>
        <span class="text-danger small" id="repassword-error"></span>
      </div>

      <hr/>

      <!-- Giới tính -->
      <div class="mb-3">
        <label class="form-label fw-semibold d-block">Giới tính</label>
        <div class="d-flex gap-4">
          <div class="form-check">
            <input class="form-check-input" type="radio" name="gender" id="genderMale" value="male" checked/>
            <label class="form-check-label" for="genderMale">Nam</label>
          </div>
          <div class="form-check">
            <input class="form-check-input" type="radio" name="gender" id="genderFemale" value="female"/>
            <label class="form-check-label" for="genderFemale">Nữ</label>
          </div>
          <div class="form-check">
            <input class="form-check-input" type="radio" name="gender" id="genderOther" value="other"/>
            <label class="form-check-label" for="genderOther">Khác</label>
          </div>
        </div>
        <span class="text-danger small" id="gender-error"></span>
      </div>

      <!-- Điều khoản -->
      <div class="mb-4">
        <div class="form-check">
          <input class="form-check-input" type="checkbox" id="terms"/>
          <label class="form-check-label small" for="terms">
            Tôi đồng ý với <a href="#" class="text-primary fw-semibold">Điều khoản sử dụng</a> và <a href="#" class="text-primary fw-semibold">Chính sách bảo mật</a>
          </label>
        </div>
        <span class="text-danger small" id="terms-error"></span>
      </div>

      <button type="submit" class="btn btn-primary w-100">Tạo tài khoản</button>

    </form>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="bttv1.js"></script>
</body>
</html>
