<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<title>Bảng điểm sinh viên</title>
</head>

<body>
    <div class="row g-2 mt-3">

<div class="col-md-4">
<input id="searchInput" class="form-control" placeholder="Tìm sinh viên...">
</div>

<div class="col-md-3">
<select id="filterRank" class="form-select">
<option value="all">Tất cả</option>
<option value="Giỏi">Giỏi</option>
<option value="Khá">Khá</option>
<option value="Trung bình">Trung bình</option>
<option value="Yếu">Yếu</option>
</select>
</div>

</div>

<div class="container mt-5">

<h2 class="mb-4">Quản lý điểm sinh viên</h2>

<div class="row g-2">

<div class="col-md-4">
<input id="nameInput" class="form-control" placeholder="Họ tên">
</div>

<div class="col-md-3">
<input id="scoreInput" type="number" class="form-control" placeholder="Điểm">
</div>

<div class="col-md-2">
<button id="addBtn" class="btn btn-primary w-100">
Thêm
</button>
</div>

</div>


<table class="table table-bordered table-striped mt-4">

<thead class="table-dark">
<tr>
<th>STT</th>
<th>Họ tên</th>
<th>Điểm</th>
<th>Xếp loại</th>
<th>Thao tác</th>
</tr>
</thead>

<tbody id="tableBody">

</tbody>

</table>

<div id="stat" class="fw-bold"></div>

</div>

<script src="script.js"></script>

</body>
</html>
